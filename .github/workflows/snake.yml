name: Змейка контрибуций

on:
  schedule:
    - cron: "0 3 * * *" # раз в сутки, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Сгенерировать SVG змейки по графику контрибуций
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#fcee0a&color_dots=#161b22,#0b3f45,#0b6f79,#00b8c4,#00f0ff
            dist/snake-light.svg?palette=github-light&color_snake=#0a0a0c&color_dots=#ebedf0,#b8f0f4,#6fdde6,#12bcc8,#0092a0

      - name: Выложить в ветку output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
